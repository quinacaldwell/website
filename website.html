/* styles.css for Data Visualization Dashboard */

body {
    font-family: 'Arial', sans-serif;
    line-height: 1.6;
    margin: 0;
    padding: 20px;
    background-color: #f4f4f4;
    color: #333;
}

.container {
    max-width: 900px;
    margin: 0 auto;
    background-color: #fff;
    padding: 20px 30px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    border-radius: 8px;
}

h1, h2 {
    color: #0056b3;
    text-align: center;
    margin-bottom: 20px;
}

.chart-container {
    width: 100%;
    max-height: 400px; /* Limit height to prevent chart from being too tall */
    margin-bottom: 30px;
    position: relative; /* Needed for Chart.js responsiveness */
}

canvas {
    display: block; /* Remove extra space below canvas */
    background-color: #eee; /* Optional: background for canvas */
    border-radius: 4px;
}

.controls {
    margin-top: 20px;
    padding: 15px;
    background-color: #e9e9e9;
    border-radius: 4px;
}

.controls h2 {
    margin-top: 0;
    color: #333;
    font-size: 1.2em;
}

/* Basic responsiveness */
@media (max-width: 768px) {
    .container {
        padding: 15px;
    }
    h1 {
        font-size: 1.8em;
    }
}
    </style>
</head>
<body>

    <div class="container">
        <h1>Data Overview</h1>
        <div class="chart-container">
            <canvas id="myChart"></canvas>
        </div>
        <div class="controls">
            <h2>Filters</h2>
            <p>Add filtering options here.</p>
            </div>
    </div>

    <script src="website.js"></script>

</body>
</html>
